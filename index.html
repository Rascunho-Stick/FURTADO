<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MEMES</title>

  <!-- Fonte moderna -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

    :root {
      --bg-gradient: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --accent-color: #2563eb;
      --accent-light: #eff6ff;
      --border-color: rgba(226, 232, 240, 0.8);
      --shadow-sm: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
      --shadow-lg: 0 20px 25px -5px rgba(15, 23, 42, 0.08), 0 8px 10px -6px rgba(15, 23, 42, 0.04);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: var(--bg-gradient);
      color: var(--text-main);
      min-height: 100vh;
      padding: 60px 20px;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      -webkit-font-smoothing: antialiased;
    }

    .container {
      max-width: 1200px;
      width: 100%;
      margin: auto;
    }

    h1 {
      font-size: 3rem;
      font-weight: 800;
      letter-spacing: -0.025em;
      margin-bottom: 12px;
      background: linear-gradient(135deg, #0f172a 0%, #334155 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-align: center;
    }

    .sub {
      font-size: 1.125rem;
      color: var(--text-muted);
      margin-bottom: 50px;
      line-height: 1.6;
      text-align: center;
      max-width: 600px;
      margin-left: auto;
      margin-right: auto;
    }

    .galeria {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 32px;
      justify-content: center;
      align-items: stretch;
    }

    .card {
      background: var(--card-bg);
      border-radius: 24px;
      overflow: hidden;
      border: 1px solid var(--border-color);
      box-shadow: var(--shadow-sm);
      transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .card:hover {
      transform: translateY(-8px);
      box-shadow: var(--shadow-lg);
      border-color: rgba(37, 99, 235, 0.2);
    }

    .card img {
      width: 100%;
      height: 260px;
      object-fit: cover;
      display: block;
      transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
      background-color: #f1f5f9;
    }

    /* Fallback para imagem sem SRC */
    .card img:not([src]), 
    .card img[src=""] {
      position: relative;
      background: #e2e8f0 linear-gradient(135deg, #cbd5e1 25%, transparent 25%, transparent 50%, #cbd5e1 50%, #cbd5e1 75%, transparent 75%, transparent);
      background-size: 20px 20px;
      opacity: 0.6;
    }

    .card:hover img {
      transform: scale(1.05);
    }

    .legenda {
      padding: 20px;
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--accent-color);
      background: var(--card-bg);
      border-top: 1px solid var(--border-color);
      text-align: center;
      letter-spacing: -0.01em;
      word-break: break-word;
      transition: background-color 0.3s ease;
    }

    .card:hover .legenda {
      background-color: var(--accent-light);
    }

    @media (max-width: 768px) {
      body {
        padding: 40px 16px;
      }

      h1 {
        font-size: 2.25rem;
      }

      .sub {
        font-size: 1rem;
        margin-bottom: 32px;
      }

      .galeria {
        gap: 20px;
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <h1>Memes</h1>

  <p class="sub">
    Página de teste — a mesma imagem, entregue em tamanhos diferentes só mudando a URL.
  </p>

  <div class="galeria">

    <div class="card">
      <img src="https://res.cloudinary.com/qfp7rvwc/image/upload/e_grayscale/hq720_euf2j3.jpg" alt="imagem preto e branco">
      <div class="legenda">e_grayscale (preto e branco)</div>
    </div>

    <div class="card">
      <img src="https://res.cloudinary.com/qfp7rvwc/image/upload/w_150/imagem_pequena_lb5spw.jpg" alt="imagem pequena">
      <div class="legenda">w_150 (pequena)</div>
    </div>

    <div class="card">
      <img src="https://res.cloudinary.com/qfp7rvwc/image/upload/w_500/imagem_preto_e_branca_n6esbz.jpg" alt="imagem quadrada">
      <div class="legenda">w_300,h_300,c_fill (quadrada)</div>
    </div>


  </div>

</div>

</body>
</html>
